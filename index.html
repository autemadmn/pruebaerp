<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tavola Chiringo | Il dolce far niente è tutto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/style.css?v=20260722-supabase">
  <!-- Subir esta versión cada vez que cambie smart.css: el archivo vive en
       public/ y no lleva hash, así que si no se toca queda cacheado. -->
  <link rel="stylesheet" href="/smart.css?v=20260727-fundido">
</head>
<body>
  <main class="menu-shell">
    <div class="language-switcher" id="languageSwitcher" aria-label="Idioma">
      <button class="language-button" type="button" data-lang="es" aria-label="Ver carta en español">
        <img class="language-flag" src="assets/ui/flags/flag-es.svg" alt="" aria-hidden="true">
      </button>
      <button class="language-button" type="button" data-lang="en" aria-label="View menu in English">
        <img class="language-flag" src="assets/ui/flags/flag-gb.svg" alt="" aria-hidden="true">
      </button>
      <button class="language-button" type="button" data-lang="de" aria-label="Speisekarte auf Deutsch anzeigen">
        <img class="language-flag" src="assets/ui/flags/flag-de.svg" alt="" aria-hidden="true">
      </button>
    </div>

    <section class="intro" aria-label="Restaurante Tavola Chiringo">
      <h1 class="brand-title">
        <img class="brand-logo" src="assets/branding/logooriginaltavola.webp" alt="Tavola Chiringo">
      </h1>
      <div class="intro-copy intro-refran" id="introCopy" aria-label="Il dolce far niente è tutto">
        <img src="assets/branding/refranadaptado.webp" alt="Il dolce far niente è tutto">
      </div>
    </section>

    <!-- Ocupa el sitio de la antigua ficha lateral: se queda fija arriba al
         hacer scroll y solo se puede plegar, nunca cerrar. -->
    <section class="smart-reco" id="smartReco" aria-label="Recomendaciones para vuestra mesa" aria-roledescription="carrusel"></section>

    <nav class="category-tabs top-tabs" id="topTabs" aria-label="Categorías de la carta"></nav>

    <section class="menu-layout" aria-label="Carta interactiva">
      <aside class="menu-list" id="menuList" aria-label="Productos de la categoría seleccionada"></aside>
    </section>
  </main>

  <nav class="category-tabs bottom-tabs" id="bottomTabs" aria-label="Cambiar sección de la carta"></nav>

  <!-- Carrito discreto: solo el lineart y el número dentro. -->
  <button class="smart-cart-fab is-empty" id="smartCartFab" type="button" aria-label="Ver el pedido, vacío">
    <svg class="smart-cart-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 4h3.2l1.1 4.4"/>
      <path d="M7.3 8.4h21l-2.9 12.2H10.2z"/>
      <circle cx="13" cy="26.4" r="1.9"/>
      <circle cx="23.6" cy="26.4" r="1.9"/>
    </svg>
    <span class="smart-cart-count" id="smartCartCount">0</span>
  </button>

  <div class="smart-onboarding" id="smartOnboarding" aria-label="Personalizar la carta"></div>
  <div class="smart-sheet" id="smartSheet" aria-label="Ficha de producto"></div>
  <div class="smart-cart" id="smartCart" aria-label="Vuestro pedido"></div>
  <div class="smart-review" id="smartReview" aria-label="Revisión del pedido"></div>

  <div class="allergen-modal" id="allergenModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="allergenTitle">
    <button class="allergen-modal-close" id="allergenModalClose" type="button" aria-label="Cerrar alérgenos">×</button>
    <div class="allergen-modal-panel">
      <p class="allergen-modal-eyebrow">Alérgenos</p>
      <h2 id="allergenTitle">Alérgenos</h2>
      <p class="allergen-modal-message">Queremos que disfrutes con tranquilidad.</p>
      <div class="allergen-modal-content" id="allergenModalContent"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
