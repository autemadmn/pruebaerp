name: Publicar prototipo en GitHub Pages

# GitHub Pages no puede servir el repositorio tal cual: esto es una app de Vite y
# hay que compilarla antes. Este flujo compila en cada push a main y publica
# únicamente el contenido de dist/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llegan varias, gana la última.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sin credenciales de Supabase el prototipo usa la instantánea local de la
      # carta y las imágenes de public/assets, que es justo lo que queremos aquí.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
